<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next B3A</title>
<style>
  :root {
    --bg: #eef2f7;
    --bg-warm: #fdf3f4;
    --ink: #1f2933;
    --muted: #64748b;
    --card: #ffffff;
    --hairline: #e6ecf2;
    --brand: #c00000;
    --brand-deep: #78001a;
    --port: #e8590c;
    --tuen: #2f9e44;
    --soon: #c92a2a;
    --mid: #e8590c;
    --later: #1c7ed6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --bg-warm: #151a21;
      --ink: #e7edf4;
      --muted: #93a1b3;
      --card: #171d24;
      --hairline: #242c36;
      --soon: #ff6b6b;
      --mid: #ffa94d;
      --later: #4dabf7;
    }
    .dir-out { --accent-ink: #ff9f68; }
    .dir-in  { --accent-ink: #69d18a; }
  }
  body { font-family: system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; margin: 0;
         min-height: 100vh; color: var(--ink);
         background: linear-gradient(160deg, var(--bg), var(--bg-warm));
         background-attachment: fixed; }
  header { position: relative; overflow: hidden; color: #fff; padding: 18px 24px 20px;
           background: linear-gradient(135deg, var(--brand), var(--brand-deep)); }
  header::after { content: ""; position: absolute; right: -50px; top: -70px;
                  width: 240px; height: 240px; border-radius: 50%;
                  background: radial-gradient(circle, rgba(255,255,255,.25), transparent 70%); }
  header h1 { position: relative; margin: 0; font-size: 28px; }
  header p { position: relative; margin: 4px 0 0; opacity: .92; }
  main { display: flex; flex-wrap: wrap; gap: 20px; padding: 24px; }
  section { flex: 1 1 320px; background: var(--card); border-radius: 14px; padding: 18px 22px;
            border-top: 5px solid var(--accent, var(--brand));
            box-shadow: 0 8px 24px rgba(15, 23, 42, .09); }
  .dir-out { --accent: var(--port); --accent-ink: #b8450b; }
  .dir-in  { --accent: var(--tuen); --accent-ink: #237a35; }
  h2 { margin: 0 0 4px; font-size: 20px; color: var(--accent-ink, var(--brand)); }
  .stop { color: var(--muted); margin: 0 0 14px; }
  .stop::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px;
                  border-radius: 50%; background: var(--accent, var(--brand)); vertical-align: 1px; }
  .bus { display: flex; justify-content: space-between; align-items: baseline;
         border-top: 1px solid var(--hairline); padding: 10px 0; }
  .min { font-size: 34px; font-weight: 700; }
  .min.soon  { color: var(--soon); }
  .min.mid   { color: var(--mid); }
  .min.later { color: var(--later); }
  .clock { color: var(--muted); }
  .none { color: var(--muted); padding: 10px 0; }
  footer { padding: 0 24px 24px; color: var(--muted); font-size: 14px; }
  footer .dot { display: inline-block; width: 8px; height: 8px; margin-right: 7px;
                border-radius: 50%; background: var(--tuen);
                box-shadow: 0 0 0 3px rgba(47, 158, 68, .15); }
</style>
</head>
<body>
<header>
  <h1>Next B3A</h1>
  <p>Citybus · Lingnan ⇄ Shenzhen Bay Port · 城巴 B3A</p>
</header>
<main>
  <section class="dir-out">
    <h2>To Shenzhen Bay Port · 往深圳灣口岸</h2>
    <p class="stop">From Fu Tai Estate, Castle Peak Road · 富泰邨</p>
    <div id="out">Loading…</div>
  </section>
  <section class="dir-in">
    <h2>To Tuen Mun · 往屯門山景邨</h2>
    <p class="stop">From Shenzhen Bay Port · 深圳灣口岸</p>
    <div id="in">Loading…</div>
  </section>
</main>
<footer><span class="dot"></span>Data: Citybus real-time ETA, DATA.GOV.HK · updated <span id="updated">–</span> · refreshes every 30 s</footer>
<script>
  // Stop IDs come from /route-stop/CTB/B3A/outbound and /stop/{id}:
  // 003261 = Fu Tai Estate (outbound, last stop before the port)
  // 003208 = Shenzhen Bay Port (inbound, first stop)
  const API = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/";
  const BOARDS = [["out", "003261", "O"], ["in", "003208", "I"]];

  async function load(boxId, stop, dir) {
    const box = document.getElementById(boxId);
    try {
      const res = await fetch(API + stop + "/B3A");
      const data = (await res.json()).data.filter(b => b.dir === dir && b.eta);
      if (data.length === 0) {
        box.innerHTML = '<div class="none">No bus in the next hour · 暫時沒有班次</div>';
        return;
      }
      box.innerHTML = data.map(b => {
        const t = new Date(b.eta);
        const min = Math.max(0, Math.round((t - Date.now()) / 60000));
        const clock = t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit",
                                                      timeZone: "Asia/Hong_Kong" });
        const note = b.rmk_en ? " · " + b.rmk_en : "";
        const tone = min <= 5 ? "soon" : min <= 15 ? "mid" : "later";
        return `<div class="bus"><span class="min ${tone}">${min === 0 ? "Arriving" : min + " min"}</span>` +
               `<span class="clock">${clock}${note}</span></div>`;
      }).join("");
    } catch (e) {
      box.innerHTML = '<div class="none">Cannot reach the data. Check the Wi-Fi.</div>';
    }
  }

  function refresh() {
    BOARDS.forEach(b => load(...b));
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Hong_Kong" });
  }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
